<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    ZooKeeper-inspired mark: stylised "ZK" — a stepped Z meeting a K with
    its base bracket. Drawn with `currentColor` so the bubble's CSS tint
    can recolour it like a brand icon.
  -->
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Z -->
    <path d="M 8 14 L 28 14 L 8 50 L 28 50" />
    <!-- K -->
    <path d="M 38 14 L 38 50" />
    <path d="M 38 32 L 56 14" />
    <path d="M 38 32 L 56 50" />
  </g>
</svg>
