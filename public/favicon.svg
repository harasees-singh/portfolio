<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Brand favicon: italic "hs" monogram inside a luminous cyan ring on a
    deep abyssal disc, mirroring the topnav brand mark in TopNav.tsx.
    Kept tab-tiny but tuned with thicker strokes + brighter fill so the
    glyph still reads at 16×16.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#082236"/>
      <stop offset="100%" stop-color="#02080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Disc background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Soft cyan halo wrapping the ring -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.85"/>

  <!-- Italic "hs" monogram. Newsreader-style serif rendered as text so it
       scales cleanly with the tab even at 16px. -->
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Newsreader','Times New Roman',serif"
    font-style="italic"
    font-weight="500"
    font-size="32"
    fill="#bae6fd"
    letter-spacing="-0.02em"
  >hs</text>
</svg>
